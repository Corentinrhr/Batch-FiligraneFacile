name: Check Upstream MTES-MCT Sources

on:
  schedule:
    - cron: "0 8 * * 1" # Tous les lundis à 08:00 UTC
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify upstream MTES-MCT files against manifest
        run: uv run python -m batch_filigrane.check_upstream

