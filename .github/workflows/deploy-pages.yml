name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Ensure vendor bundles match package-lock.json
        run: |
          npm ci
          npm run sync-vendor

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload static frontend artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "src/batch_filigrane/static"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

