version: 2
updates:
  # 1. Dépendances Python gérées par uv (pyproject.toml / uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # 2. Dépendances JavaScript front-end embarquées (package.json / package-lock.json -> vendor/)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # 3. Actions GitHub (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

