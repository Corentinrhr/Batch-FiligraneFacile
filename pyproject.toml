[project]
name = "batch-filigrane"
version = "0.1.0"
description = "Traitement par lot en parallèle de documents PDF et images avec le moteur officiel FiligraneFacile (beta.gouv.fr)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
batch-filigrane = "batch_filigrane:main"
check-upstream = "batch_filigrane.check_upstream:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
